<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgia Personaggi D&amp;D &amp; Codex Tattico</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2356c4ca'/%3E%3Cpath d='M9 23l14-14M18 9h5v5M11 17l4 4M8 24l2-2' stroke='%23031a1b' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* ==========================================================================
   DESIGN SYSTEM — "lume e verderame"
   Scena: al tavolo da gioco, la sera, luce bassa e calda; telefono o portatile
   accanto ai dadi. Tema scuro di default, chiaro per il giorno.
   Neutri leggermente caldi (tinta 60), un solo accento verderame (tinta 200),
   semantici per PF: danno rosso, cura verde, attenzione ambra.
   Un'unica famiglia (Atkinson Hyperlegible: cifre ben distinguibili),
   la sua versione mono solo per numeri e dadi.
   ========================================================================== */
:root {
  color-scheme: dark;
  --bg: oklch(0.165 0.008 60);
  --surface: oklch(0.205 0.009 60);
  --raised: oklch(0.245 0.010 60);
  --sunk: oklch(0.18 0.008 60);
  --line: oklch(0.32 0.010 60);
  --line-strong: oklch(0.56 0.012 60);
  --ink: oklch(0.95 0.006 80);
  --ink-2: oklch(0.80 0.010 70);
  --ink-3: oklch(0.70 0.012 70);

  --accent: oklch(0.80 0.095 200);
  --accent-fill: oklch(0.76 0.10 200);
  --accent-fill-hover: oklch(0.82 0.09 200);
  --on-accent: oklch(0.20 0.03 200);
  --accent-soft: oklch(0.76 0.10 200 / 0.14);
  --accent-line: oklch(0.76 0.10 200 / 0.55);

  --danger: oklch(0.72 0.16 25);
  --danger-soft: oklch(0.72 0.16 25 / 0.13);
  --danger-line: oklch(0.72 0.16 25 / 0.5);
  --ok: oklch(0.78 0.14 150);
  --ok-soft: oklch(0.78 0.14 150 / 0.13);
  --ok-line: oklch(0.78 0.14 150 / 0.5);
  --warn: oklch(0.82 0.12 80);
  --warn-soft: oklch(0.82 0.12 80 / 0.13);

  --font: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;

  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --r: 8px;        /* controlli: pulsanti, campi, segmenti */
  --r-lg: 12px;    /* pannelli */
  --r-chip: 999px; /* solo chip/condizioni */
  --shadow: none;
  --ease: cubic-bezier(0.25, 1, 0.5, 1); /* ease-out-quart */
  --topbar-h: 64px;

  /* z-index semantici */
  --z-sticky: 10;
  --z-nav: 20;
  --z-toast: 40;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: oklch(0.972 0.002 60);
  --surface: oklch(0.995 0.001 60);
  --raised: oklch(0.945 0.003 60);
  --sunk: oklch(0.985 0.002 60);
  --line: oklch(0.88 0.004 60);
  --line-strong: oklch(0.60 0.006 60);
  --ink: oklch(0.22 0.010 60);
  --ink-2: oklch(0.40 0.010 60);
  --ink-3: oklch(0.48 0.010 60);

  --accent: oklch(0.48 0.09 205);
  --accent-fill: oklch(0.48 0.09 205);
  --accent-fill-hover: oklch(0.42 0.09 205);
  --on-accent: oklch(0.99 0.005 200);
  --accent-soft: oklch(0.48 0.09 205 / 0.09);
  --accent-line: oklch(0.48 0.09 205 / 0.45);

  --danger: oklch(0.52 0.18 25);
  --danger-soft: oklch(0.52 0.18 25 / 0.08);
  --danger-line: oklch(0.52 0.18 25 / 0.45);
  --ok: oklch(0.50 0.12 150);
  --ok-soft: oklch(0.50 0.12 150 / 0.08);
  --ok-line: oklch(0.50 0.12 150 / 0.45);
  --warn: oklch(0.52 0.11 70);
  --warn-soft: oklch(0.52 0.11 70 / 0.1);
  --shadow: 0 1px 2px oklch(0.22 0.01 60 / 0.06), 0 2px 8px oklch(0.22 0.01 60 / 0.04);
}

/* ==========================================================================
   BASE
   ========================================================================== */
* { box-sizing: border-box; }
html { scrollbar-color: var(--line-strong) transparent; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--font);
  min-height: 100vh;
  padding-bottom: var(--s10);
}
::selection { background: var(--accent-soft); color: var(--ink); }
h1, h2, h3, h4 { font-family: var(--font); font-weight: 700; margin: 0; color: var(--ink); line-height: 1.25; text-wrap: balance; }
p { text-wrap: pretty; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ic { width: 1.15em; height: 1.15em; flex: none; fill: currentColor; vertical-align: -0.2em; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ==========================================================================
   BARRA SUPERIORE
   ========================================================================== */
.topbar {
  position: sticky;
  top: 0;
  z-index: var(--z-sticky);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 0 var(--s5);
}
.topbar-inner {
  max-width: 1480px;
  min-height: var(--topbar-h);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3) var(--s6);
}
.brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.brand-icon {
  width: 36px; height: 36px;
  border-radius: var(--r);
  background: var(--accent-fill);
  color: var(--on-accent);
  display: grid; place-items: center;
  flex: none;
}
.brand-icon .ic { width: 22px; height: 22px; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-title { font-size: 1.05rem; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.brand-subtitle { font-size: 0.8rem; color: var(--ink-3); white-space: nowrap; }

/* Segmented controls: modalità, edizione, schede */
.nav-modes, .edition-selector, .tabs {
  display: inline-flex;
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 3px;
  gap: 2px;
}
.nav-btn, .edition-selector button, .tabs button {
  border: 0;
  background: transparent;
  color: var(--ink-2);
  font-weight: 600;
  font-size: 0.9rem;
  min-height: 34px;
  padding: 0 var(--s3);
  border-radius: 6px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  white-space: nowrap;
  transition: background-color 150ms var(--ease), color 150ms var(--ease);
}
.nav-btn:hover, .edition-selector button:hover, .tabs button:hover { color: var(--ink); background: var(--raised); }
.nav-btn[aria-pressed="true"], .edition-selector button[aria-pressed="true"], .tabs button[aria-selected="true"] {
  background: var(--accent-fill);
  color: var(--on-accent);
}
.edition-selector button { font-size: 0.85rem; padding: 0 var(--s3); }

.top-actions { display: flex; align-items: center; gap: var(--s2); }
.btn-theme {
  width: 38px; height: 38px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--raised);
  color: var(--ink);
  cursor: pointer;
  display: grid; place-items: center;
  transition: border-color 150ms var(--ease);
}
.btn-theme:hover { border-color: var(--line-strong); }
.btn-theme .ic { width: 20px; height: 20px; }
.btn-theme .i-light { display: none; }
:root[data-theme="light"] .btn-theme .i-light { display: block; }
:root[data-theme="light"] .btn-theme .i-dark { display: none; }

/* ==========================================================================
   PULSANTI
   ========================================================================== */
.btn {
  border: 1px solid var(--line-strong);
  background: var(--raised);
  color: var(--ink);
  font-weight: 600;
  font-size: 0.9rem;
  min-height: 38px;
  padding: 0 var(--s4);
  border-radius: var(--r);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  text-decoration: none;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
}
.btn:hover { border-color: var(--ink-3); background: var(--surface); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-fill-hover); border-color: var(--accent-fill-hover); }
.btn.danger { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); }
.btn.danger:hover { border-color: var(--danger); }
.btn.small { font-size: 0.85rem; min-height: 32px; padding: 0 var(--s3); }
.btns { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }

/* ==========================================================================
   AREA DI LAVORO E MODALITÀ
   ========================================================================== */
.app {
  max-width: 1480px;
  margin: var(--s6) auto 0;
  padding: 0 var(--s5);
  display: grid;
  gap: var(--s6);
}
.app[data-layout="play-only"], .app[data-layout="forge-only"] { grid-template-columns: minmax(0, 1fr); max-width: 1040px; }
.app[data-layout="play-only"] .builder { display: none !important; }
.app[data-layout="forge-only"] .sheet { display: none !important; }
.app[data-layout="split"] { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; }
/* Solo affiancata: la scheda resta visibile mentre la forgia scorre */
@media (min-width: 1100px) {
  .app[data-layout="split"] .sheet {
    position: sticky;
    top: calc(var(--topbar-h) + var(--s4));
    max-height: calc(100vh - var(--topbar-h) - var(--s8));
    overflow-y: auto;
    padding-right: var(--s2);
  }
  .app[data-layout="split"] .to-builder { display: none; }
}
@media (max-width: 1099px) {
  .app[data-layout="split"] { grid-template-columns: minmax(0, 1fr); }
  #btn-mode-split { display: none; }
}

/* ==========================================================================
   FORGIA
   ========================================================================== */
.builder { display: grid; gap: var(--s4); }

/* Pannello creazione rapida */
.speedrun-dock {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s4) var(--s5);
  display: grid;
  gap: var(--s3);
  box-shadow: var(--shadow);
}
.dock-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s3); }
.dock-title { display: flex; align-items: center; gap: var(--s2); font-size: 1.05rem; font-weight: 700; }
.dock-title .ic { color: var(--accent); }
.dock-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.dock-levels { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.dock-levels .label { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); margin-right: var(--s1); }
.lvl-pill {
  border: 1px solid var(--line);
  background: var(--sunk);
  color: var(--ink-2);
  border-radius: 6px;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.85rem;
  min-width: 34px;
  min-height: 32px;
  padding: 0 var(--s2);
  cursor: pointer;
  transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease);
}
.lvl-pill:hover { color: var(--ink); border-color: var(--line-strong); }
.lvl-pill.active { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); font-weight: 700; }

/* Navigazione dei passi */
.stepnav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 2px var(--s2);
  scrollbar-width: thin;
  scroll-snap-type: x proximity;
}
.stepnav button {
  white-space: nowrap;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: var(--r);
  min-height: 34px;
  padding: 0 var(--s3);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  scroll-snap-align: start;
  transition: border-color 150ms var(--ease), color 150ms var(--ease);
}
.stepnav button:hover { color: var(--ink); border-color: var(--line-strong); }
.stepnav button .n, .step > h2 .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--ink-3); font-weight: 500; }

/* Passi */
.step {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s6) var(--s6);
  display: grid;
  gap: var(--s4);
  box-shadow: var(--shadow);
  scroll-margin-top: calc(var(--topbar-h) + var(--s4));
}
.step > h2 {
  font-size: 1.25rem;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--s2) var(--s3);
}
.step > h2 .n { margin-right: -2px; }

.row { display: grid; gap: var(--s3) var(--s4); grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); }
label.f { display: grid; gap: 6px; font-size: 0.875rem; color: var(--ink-2); font-weight: 600; align-content: start; }
label.f > :is(input, select, textarea) { font-size: 1rem; color: var(--ink); font-weight: 400; }
input:not([type=checkbox]):not([type=file]), select, textarea {
  width: 100%;
  min-height: 40px;
  background: var(--sunk);
  border: 1px solid var(--line-strong);
  border-radius: var(--r);
  padding: 7px var(--s3);
  caret-color: var(--accent);
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
input:not([type=checkbox]):hover, select:hover, textarea:hover { border-color: var(--ink-3); }
input:not([type=checkbox]):focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }
input[type=checkbox] { accent-color: var(--accent-fill); width: 18px; height: 18px; margin: 0; flex: none; }
textarea { font-family: var(--mono); font-size: 0.875rem; min-height: 96px; resize: vertical; line-height: 1.45; }

.hint { font-size: 0.875rem; color: var(--ink-2); margin: 0; line-height: 1.5; }
.hint b { color: var(--ink); }
.hint.error { color: var(--danger); }
.trait {
  font-size: 0.9375rem;
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: var(--s3) var(--s4);
  white-space: pre-line;
  max-height: 260px;
  overflow-y: auto;
  line-height: 1.55;
  max-width: 75ch;
}
details > summary {
  cursor: pointer;
  color: var(--accent);
  font-size: 0.95rem;
  font-weight: 600;
  padding: var(--s2) 0;
  width: fit-content;
}
details > summary:hover { text-decoration: underline; text-underline-offset: 3px; }

.scores { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s3); }
.scores label.f { text-align: center; justify-items: stretch; }
.scores input, .scores select { text-align: center; font-family: var(--mono); font-weight: 700; font-size: 1.05rem; }

.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr)); gap: 2px var(--s4); }
.pick { display: flex; align-items: center; gap: var(--s2); font-size: 0.95rem; min-height: 36px; }
.pick .ab { font-family: var(--mono); font-size: 0.8rem; color: var(--ink-3); }
.pick.suggest .lbl { text-decoration: underline dotted var(--accent); text-underline-offset: 4px; font-weight: 600; }
.pick.locked { color: var(--ink-3); }
.pick.end { align-self: end; }
.scores.adjust { margin-top: var(--s2); }
.pick input[data-list="expertise"]:not(:disabled) { accent-color: var(--warn); }

.counter {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.8rem;
  padding: 1px var(--s2);
  border-radius: 6px;
  background: var(--sunk);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-weight: 500;
  white-space: nowrap;
}
.counter.over { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  border: 1px solid var(--line);
  background: var(--sunk);
  border-radius: var(--r-chip);
  padding: 2px 4px 2px var(--s3);
  font-size: 0.875rem;
}
.chip button {
  border: 0; background: none; cursor: pointer; color: var(--ink-3);
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
}
.chip button:hover { color: var(--danger); background: var(--danger-soft); }

.badge {
  font-family: var(--font);
  font-size: 0.75rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1px 6px;
  color: var(--ink-2);
  font-weight: 600;
  white-space: nowrap;
}
.badge.warn { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); }
.badge.ok { color: var(--ok); border-color: var(--ok-line); background: var(--ok-soft); }
.badge.gold { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }

.spell-lv { border-top: 1px solid var(--line); padding-top: var(--s2); }
.spell-lv summary { color: var(--ink); font-weight: 600; display: flex; align-items: baseline; gap: var(--s2); width: auto; }
.spell { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 var(--s3); padding: 6px 0; font-size: 0.95rem; align-items: start; }
.spell > input { margin-top: 3px; }
.spell small { grid-column: 2; color: var(--ink-3); font-size: 0.8rem; }
.spell .sdesc { color: var(--ink-2); font-size: 0.82rem; line-height: 1.4; margin-top: 2px; }
.spell.blocked > span:first-of-type { color: var(--ink-3); }

.pers { display: grid; gap: var(--s4); }
.pers-row { display: grid; gap: 6px; }
.pers-ctl { display: flex; gap: var(--s2); }
.pers-ctl select { flex: 1; min-width: 0; }
textarea.prose { font-family: var(--font); font-size: 0.95rem; min-height: 0; resize: vertical; }

/* Talenti e aumenti */
.slots-list { display: grid; }
.fslot { display: grid; gap: var(--s3); padding: var(--s4) 0; border-top: 1px solid var(--line); }
.fslot:first-child { border-top: 0; padding-top: 0; }
.fslot.fixed { font-size: 0.95rem; }
.grants { display: grid; gap: var(--s4); }
.grant { display: grid; gap: var(--s2); }

/* ==========================================================================
   TAVOLO E SCHEDA
   ========================================================================== */
.sheet { display: grid; gap: var(--s5); min-width: 0; align-content: start; }

.sheet-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s3); }
.panel { display: grid; gap: var(--s5); }

.sh-head { display: grid; gap: var(--s1); }
.sh-head h2 { font-size: 1.75rem; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.sh-head .meta { color: var(--ink-2); font-size: 1rem; display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }

.notice {
  display: flex; gap: var(--s3); align-items: flex-start;
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  border-radius: var(--r);
  padding: var(--s3) var(--s4);
  font-size: 0.95rem;
}
.notice .ic { color: var(--accent); margin-top: 2px; }
.warns { margin: 0; padding: var(--s3) var(--s4) var(--s3) var(--s8); background: var(--warn-soft); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink); font-size: 0.9rem; display: grid; gap: var(--s1); }
.warns li::marker { color: var(--warn); }

.play-deck { display: grid; gap: var(--s5); }

/* Pannello vitali: PF a sinistra, numeri chiave a destra */
.vitals-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s5);
  display: grid;
  gap: var(--s4);

function applySpellFilter() {
  const rows = [...document.querySelectorAll('#builder .spell')];
  if (!rows.length) return;
  const q = spellQ.trim().toLowerCase(), filtering = q || spellSchool || spellRitual || spellChosen;
  let shown = 0;
  rows.forEach(r => {
    r.hidden = (q && !r.dataset.name.includes(q)) || (spellSchool && r.dataset.school !== spellSchool) || (spellRitual && !r.dataset.ritual) || (spellChosen && !r.dataset.chosen);
    if (!r.hidden) shown++;
  });
  document.querySelectorAll('#builder .spell-lv').forEach(d => {
    const any = [...d.querySelectorAll('.spell')].some(r => !r.hidden);
    d.hidden = !any;
    if (filtering && any) d.open = true;
  });
  const sc = $('#spell-count');
  if (sc) sc.textContent = filtering ? (shown ? `${shown} incantesimi trovati.` : 'Nessun incantesimo corrisponde ai filtri.') : '';
}

function sanitize() {
  if (!Array.isArray(st.excludedSources)) st.excludedSources = E.defaultExcluded(full());
  if (!Array.isArray(st.excludedItems)) st.excludedItems = [];
  const D = data();
  if (!D.races[st.race]) st.race = Object.keys(D.races).sort()[0];
  if (!D.races[st.race].variants?.includes(st.subrace)) st.subrace = D.races[st.race].variants?.[0] || '';
  if (!D.classes[st.cls]) st.cls = D.classes.fighter ? 'fighter' : Object.keys(D.classes)[0];
  if (!D.classes[st.cls].subclasses.includes(st.subclass)) st.subclass = D.classes[st.cls].subclasses[0] || '';
  if (!D.backgrounds[st.background]) st.background = Object.keys(D.backgrounds)[0];
  st.weapons = (st.weapons || []).filter(k => D.weapons[k]);
  for (const [k, v] of [['asi', []], ['extraFeats', []], ['masteries', []], ['extraChoices', {}], ['bonusSpells', {}], ['featureChoices', {}]]) if (!st[k] || typeof st[k] !== 'object') st[k] = v;
  if (st.armour && !D.armour[st.armour]) st.armour = '';
  if (st.originFeat && !D.feats[st.originFeat]) st.originFeat = '';
  st.masteries = st.masteries.filter(k => D.weapons[k]?.mastery);
  for (const [k, v] of [['levels', []], ['subclasses', {}], ['classSpells', {}], ['magicItems', []], ['inventory', []], ['coins', {}], ['raceBonus', { mode: '21' }], ['bgBonus', { mode: '21' }], ['companions', {}], ['wildForms', []], ['spentSlots', {}], ['spentLimited', {}], ['conditions', []]]) if (!st[k] || typeof st[k] !== 'object') st[k] = v;
  
  const lv = [];
  for (let i = 0; i < (+st.level || 1); i++) lv.push(i === 0 ? st.cls : (D.classes[st.levels[i]] ? st.levels[i] : lv[i - 1]));
  st.levels = lv;
  st.subclasses[st.cls] = st.subclass;
  for (const k of new Set(lv)) if (!D.classes[k].subclasses.includes(st.subclasses[k])) st.subclasses[k] = D.classes[k].subclasses[0] || '';
  st.subclass = st.subclasses[st.cls];
  if (st.bgVariant && !(D.backgrounds[st.background].variants || []).includes(st.bgVariant)) st.bgVariant = '';
  st.magicItems = st.magicItems.filter(it => it && D.magicItems?.[it.key]);
  if (st.spells && st.spells.length && !st.classSpells[st.cls]) st.classSpells[st.cls] = st.spells;
  st.spells = [];
  const sc = E.compute(st, D);
  const castingKeys = new Set(sc.castings.map(cs => cs.cls));
  for (const k of Object.keys(st.classSpells)) if (!castingKeys.has(k)) delete st.classSpells[k];
  sc.castings.forEach(cs => {
    const learn = new Set(E.spellOptions(st, D, cs).map(x => x.key));
    st.classSpells[cs.cls] = (st.classSpells[cs.cls] || []).filter(k => learn.has(k));
  });
  st.personality = Object.assign({ trait: '', ideal: '', bond: '', flaw: '' }, st.personality);
  if (typeof st.notes !== 'string') st.notes = '';
  if (st.hpCurrent == null || st.hpCurrent > sc.hp) st.hpCurrent = sc.hp;
  st.hpTemp = Math.max(0, +st.hpTemp || 0);
}

// Speedrun Helpers
function speedrunOptimizeAbilityScores() {
  const D = data();
  const cls = D.classes[st.cls];
  if (!cls) return;
  const pri = cls.primaryAbility?.toLowerCase() || '';
  const map = {
    barbarian: [0, 2, 1, 5, 4, 3],
    bard: [5, 1, 2, 3, 4, 0],
    cleric: [4, 2, 1, 0, 3, 5],
    druid: [4, 2, 1, 3, 0, 5],
    fighter: pri.includes('dex') ? [1, 2, 0, 4, 3, 5] : [0, 2, 1, 4, 3, 5],
    monk: [1, 4, 2, 0, 3, 5],
    paladin: [0, 5, 2, 4, 3, 1],
    ranger: [1, 4, 2, 3, 0, 5],
    rogue: [1, 2, 3, 4, 5, 0],
    sorcerer: [5, 2, 1, 3, 4, 0],
    warlock: [5, 2, 1, 3, 4, 0],
    wizard: [3, 1, 2, 4, 5, 0],
    artificer: [3, 2, 1, 4, 0, 5],
  };
  const order = map[st.cls.replace(/@\d+$/, '')] || [0, 1, 2, 3, 4, 5];
  const std = [15, 14, 13, 12, 10, 8];
  const newBase = [10, 10, 10, 10, 10, 10];
  order.forEach((abIdx, rank) => { newBase[abIdx] = std[rank]; });
  st.method = 'standard';
  st.base = newBase;
  render();
}

function speedrunEquipRecommended() {
  const D = data();
  const cls = D.classes[st.cls];
  if (!cls) return;
  const hasProf = a => (cls.armor || []).some(x => new RegExp(x, 'i').test(a));
  if (hasProf('heavy') && D.armour['chain mail']) st.armour = 'chain mail';
  else if (hasProf('medium') && D.armour['scale mail']) st.armour = 'scale mail';
  else if (hasProf('light') && D.armour['leather']) st.armour = 'leather';
  else st.armour = '';

  if (hasProf('shield')) st.shield = true;

  const wProfs = (cls.weapons || []).join(' ').toLowerCase();
  const pickW = name => Object.keys(D.weapons).find(k => k.toLowerCase() === name.toLowerCase());
  const martial = wProfs.includes('martial');
  const primaryW = martial ? (pickW('longsword') || pickW('rapier') || pickW('greatsword')) : (pickW('mace') || pickW('spear') || pickW('quarterstaff') || pickW('dagger'));
  if (primaryW && !st.weapons.includes(primaryW)) st.weapons = [primaryW];
  
  if (D.packs) {
    const pkKey = Object.keys(D.packs)[0];
    if (pkKey && D.packs[pkKey]?.items) {
      st.inventory = D.packs[pkKey].items.map(x => ({ name: x.name, qty: x.amount, weight: x.weight }));
    }
  }
  if (!st.coins.gp) st.coins.gp = 15;
  render();
}

          return `<label class="spell${ok === false ? ' blocked' : ''}" data-xcname="${esc(o.name.toLowerCase())}"><input type="checkbox" data-xc="${esc(cf.qkey)}" value="${esc(o.key)}"${picked.has(o.key) || auto.has(o.key) ? ' checked' : ''}${auto.has(o.key) ? ' disabled' : ''}>

function featSlotHtml(sl, D, s) {
  const f = D.feats[sl.feat];
  if (sl.kind === 'background') return `<div class="fslot fixed"><b>${esc(sl.label)}:</b> ${esc(f ? lab(f) : sl.feat)}${sl.choice ? ` (${esc(sl.choice)})` : ''}</div>`;
  const base = sl.kind === 'asi' ? `asi.${sl.index}` : sl.kind === 'extra' ? `extraFeats.${sl.index}` : null;
  const featPath = base ? base + '.feat' : 'originFeat', choicePath = base ? base + '.choice' : 'originFeatChoice';
  const origin24 = sl.kind === 'origin' && (D.races[st.race]?.ed || st.edition) === '2024';
  const list = byName(D.feats).filter(([, x]) => origin24 ? x.type === 'origin' : x.type !== 'fighting style')
    .map(([k, x]) => [k, lab(x) + (x.type && !origin24 ? ` (${x.type})` : '')]);
  const parts = [`<label class="f">${esc(sl.label)}<select id="f-slot-${sl.id}" data-k="${featPath}">${opts(list, sl.feat, sl.kind === 'asi' ? 'Aumento di caratteristica (+1/+1 o +2)' : '— scegli talento —')}</select></label>`];
  if (sl.kind === 'asi' && !sl.feat) parts.push(`<label class="f">+1 a<select id="f-slot-${sl.id}-a" data-k="${base}.a">${abilOpts(sl.a)}</select></label><label class="f">+1 a<select id="f-slot-${sl.id}-b" data-k="${base}.b">${abilOpts(sl.b)}</select></label>`);
  if (f?.choices?.length) parts.push(`<label class="f">Scelta<select id="f-slot-${sl.id}-c" data-k="${choicePath}">${opts(f.choices.map(o => [o.key, o.name]), sl.choice, '— scegli —')}</select></label>`);
  return `<div class="fslot"><div class="row">${parts.join('')}</div>

  const byLv = {}; list.forEach(x => (byLv[x.level] ||= []).push(x));
  const id = k => i === 0 ? 'sp-' + k : `sp-${cs.cls}-${k}`;
  return `<div class="cs-block"><h3 class="cs-head">${esc(cs.name)} ${cs.level} <span class="hint">${cs.ability} · CD ${cs.dc} · attacco ${E.sign(cs.attack)}</span>
      ${cs.cantrips ? `<span class="counter${cs.picked.cantrips > cs.cantrips ? ' over' : ''}">trucchetti ${cs.picked.cantrips} / ${cs.cantrips}</span>` : ''}
      ${lim != null ? `<span class="counter${!cs.spellbook && cs.picked.spells > lim ? ' over' : ''}">${cs.spellbook ? 'libro' : cs.prepared != null ? 'preparati' : 'conosciuti'} ${cs.picked.spells}${cs.spellbook ? '' : ' / ' + lim}</span>` : ''}
      ${cs.schools ? `<span class="counter${cs.offUsed > cs.offAllowed ? ' over' : ''}">fuori scuola ${cs.offUsed} / ${cs.offAllowed}</span>` : ''}</h3>
    ${cs.spellbook ? `<p class="hint">Prepara <b>${lim}</b> incantesimi dal libro; qui segna quelli scritti nel grimorio.</p>` : ''}
    ${cs.alwaysPrepared.length ? `<p class="hint">Sempre preparati: <b>${cs.alwaysPrepared.map(k => esc(D.spells[k]?.name || k)).join(', ')}</b></p>` : ''}
    ${Object.entries(byLv).map(([lv, arr]) => `<details class="spell-lv" data-id="sl-${esc(cs.cls)}-${lv}"${open.has(`sl-${cs.cls}-${lv}`) || (!open.size && lv <= 1 && i === 0) ? ' open' : ''}>
      <summary>${lv == 0 ? 'Trucchetti' : `Livello ${lv}`} <span class="hint">(${arr.filter(x => chosen.has(x.key)).length}/${arr.length})</span></summary>
      <div class="picks">${arr.map(x => `<label class="spell" data-name="${esc((x.name + ' ' + (x.desc || '')).toLowerCase())}" data-school="${esc(x.school || '')}" data-ritual="${x.ritual ? 1 : ''}" data-chosen="${chosen.has(x.key) ? 1 : ''}"><input type="checkbox" id="${esc(id(x.key))}" data-cs="${esc(cs.cls)}" value="${esc(x.key)}"${chosen.has(x.key) ? ' checked' : ''}>
        <span>${esc(x.name)}${x.ritual ? ' <span class="badge">R</span>' : ''}${x.offList ? ' <span class="badge">fuori scuola</span>' : ''}${cs.alwaysPrepared.includes(x.key) ? ' <span class="badge">sempre</span>' : ''}</span><small>${SCHOOL[x.school] || esc(x.school || '')} · ${esc(x.time)} · ${esc(x.range)} · ${esc(abbr(x))}</small><small class="sdesc">${esc(x.desc || '')}</small></label>`).join('')}</div></details>`).join('')}</div>`;
}

function equipmentHtml(s, D, bg, open) {
  const inv = s.inventory;
  const miNames = Object.entries(D.magicItems || {}).sort((a, b) => a[1].name.localeCompare(b[1].name));
  const cls = D.classes[st.cls];
  const start = cls.startOptions?.length ? cls.startOptions.map((o, i) => `<button type="button" class="btn small" data-act="addStart" data-i="${i}">Opzione ${o.label}: ${esc([...o.items.map(x => (x.amount > 1 ? x.amount + '× ' : '') + x.name), o.pack ? 'pacchetto ' + o.pack : '', o.gold ? o.gold + ' mo' : ''].filter(Boolean).join(', '))}</button>`).join('') : '';
  return `<h3 class="sub">Oggetti magici <span class="counter${inv.attuned > 3 ? ' over' : ''}">sintonia ${inv.attuned} / 3</span></h3>
    <div class="row"><label class="f">Aggiungi oggetto magico<input id="f-mi-add" list="mi-list" data-miadd placeholder="scrivi il nome…" autocomplete="off"></label></div>
    <datalist id="mi-list">${miNames.map(([k, m]) => `<option value="${esc(m.name)}">${esc([m.rarity, m.attunement ? 'sintonia' : '', abbr(m)].filter(Boolean).join(' · '))}</option>`).join('')}</datalist>
    <div class="items">${st.magicItems.map((it, i) => { const m = D.magicItems[it.key]; return `<div class="item-row"><b>${esc(m.name)}</b> <span class="ab">${esc([m.rarity, m.type].filter(Boolean).join(' · '))}</span>
      ${m.attunement ? `<label class="pick"><input type="checkbox" data-miat="${i}"${it.attuned ? ' checked' : ''}>in sintonia</label>` : ''}
      ${m.choices?.length ? `<select data-mich="${i}" aria-label="Variante di ${esc(m.name)}">${opts(m.choices.map(o => [o.key, o.name]), it.choice || '', '— variante —')}</select>` : ''}
      <button type="button" class="btn small danger" data-act="rmItem" data-i="${i}">Rimuovi</button>
      ${m.prerequisite ? `<small class="hint">${esc(m.prerequisite)}</small>` : ''}</div>`; }).join('') || '<p class="hint">Nessun oggetto magico.</p>'}</div>
    <h3 class="sub">Zaino <span class="counter${inv.total > inv.capacity ? ' over' : ''}">${inv.total} / ${inv.capacity} lb</span></h3>
    ${!st.inventory.length ? '<p class="hint">Zaino vuoto: aggiungi oggetti qui sotto o usa la dotazione della classe o del background.</p>' : ''}
    <div class="tbl-wrap"${st.inventory.length ? '' : ' hidden'}><table class="inv"><thead><tr><th>Oggetto</th><th>Q.tà</th><th>Peso (lb)</th><th></th></tr></thead><tbody>
      ${st.inventory.map((it, i) => `<tr><td><input data-inv="${i}" data-f="name" value="${esc(it.name)}" aria-label="Oggetto"></td><td><input type="number" min="0" data-inv="${i}" data-f="qty" value="${esc(it.qty)}" aria-label="Quantità"></td><td><input type="number" min="0" step="0.1" data-inv="${i}" data-f="weight" value="${esc(it.weight)}" aria-label="Peso"></td><td><button type="button" class="btn small" data-act="rmInv" data-i="${i}" aria-label="Rimuovi">×</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="row">
      <label class="f">Aggiungi oggetto comune<select data-gearadd>${opts(Object.entries(D.gear || {}).sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([k, g]) => [k, `${g.name} (${g.weight} lb)`]), '', '— scegli —')}</select></label>
      <label class="f">Aggiungi pacchetto<select data-packadd>${opts(Object.entries(D.packs || {}).map(([k, p]) => [k, p.name]), '', '— scegli —')}</select></label>
    </div>
    <div class="btns"><button type="button" class="btn small" data-act="addInv">Riga vuota</button><button type="button" class="btn small" data-act="addBgItems">Dotazione background</button>${start}</div>
    ${cls.equipment ? `<details class="xc" data-id="clseq"${open.has('clseq') ? ' open' : ''}><summary>Equipaggiamento iniziale di ${esc(cls.name)}</summary><div class="trait">${esc(cls.equipment)}</div></details>` : ''}
    <h3 class="sub">Monete <span class="hint">(${inv.gpValue} mo in totale)</span></h3>
    <div class="scores">${['cp', 'sp', 'ep', 'gp', 'pp'].map(k => `<label class="f">${{ cp: 'mr', sp: 'ma', ep: 'me', gp: 'mo', pp: 'mp' }[k]}<input type="number" min="0" id="f-coin-${k}" data-k="coins.${k}" data-num value="${+st.coins[k] || 0}"></label>`).join('')}</div>`;
}

function renderEdition() {
  $('#edition').innerHTML = ['2014', '2024'].map(e => `<button type="button" data-ed="${e}" aria-pressed="${st.edition === e}"><span class="ed-long">${e === '2014' ? 'D&amp;D 5e · ' : 'D&amp;D 5.5 · '}</span>${e}</button>`).join('');
}

function renderBuilder() {
  const D = data(), s = E.compute(st, D), race = D.races[st.race], cls = D.classes[st.cls], bg = D.backgrounds[st.background];
  const open = new Set([...document.querySelectorAll('#builder details[open]')].map(d => d.dataset.id));
  const html = [], steps = [];
  const step = (id, label, extra = '') => {
    steps.push([id, label]);
    return `<section class="step" id="step-${id}" aria-labelledby="h-${id}"><h2 id="h-${id}"><span class="n">${String(steps.length).padStart(2, '0')}</span>${label}${extra}</h2>`;
  };

  // Speedrun Hero Control Dock
  const speedrunHero = `<div class="speedrun-dock">
    <div class="dock-header">
      <h2 class="dock-title">${ic('bolt')} Creazione rapida</h2>
      <div class="dock-actions">
        <button type="button" class="btn small primary" data-act="speedrun-opt" title="Distribuisce la serie standard in base alla classe">Ottimizza caratteristiche</button>
        <button type="button" class="btn small" data-act="speedrun-equip" title="Armatura, arma e zaino adatti alla classe">${ic('shield')} Dotazione consigliata</button>
        <button type="button" class="btn small" data-act="jump-play">${ic('dice')} Vai al Tavolo</button>
      </div>
    </div>
    <div class="dock-levels" role="group" aria-label="Livello del personaggio">
      <span class="label" aria-hidden="true">Livello</span>
      ${[1, 2, 3, 4, 5, 6, 7, 8, 10, 12, 14, 16, 18, 20].map(lvl => `<button type="button" class="lvl-pill${st.level === lvl ? ' active' : ''}" data-setlvl="${lvl}" aria-pressed="${st.level === lvl}" aria-label="Livello ${lvl}">${lvl}</button>`).join('')}
    </div>
  </div>`;

  html.push(speedrunHero);

  html.push(`${step('id', 'Identità')}<div class="row">
    <label class="f">Nome personaggio<input id="f-name" data-k="name" value="${esc(st.name)}" placeholder="Senza nome"></label>
    <label class="f">Giocatore<input id="f-player" data-k="player" value="${esc(st.player)}"></label>
    <label class="f">Livello totale<select id="f-level" data-k="level" data-num>${opts(Array.from({ length: 20 }, (_, i) => [i + 1, i + 1]), st.level)}</select></label>
    <label class="f">Allineamento<select id="f-align" data-k="alignment">${opts(['Lawful Good', 'Neutral Good', 'Chaotic Good', 'Lawful Neutral', 'True Neutral', 'Chaotic Neutral', 'Lawful Evil', 'Neutral Evil', 'Chaotic Evil'].map(a => [a, a]), st.alignment, '—')}</select></label>
  </div></section>`);

  const variants = race.variants || [];
  const raceWord = st.edition === '2024' ? 'Specie' : st.mixOther ? 'Razza / specie' : 'Razza';
  html.push(`${step('race', raceWord)}<div class="row">
    <label class="f">${raceWord}<select id="f-race" data-k="race">${opts(byName(D.races).map(([k, r]) => [k, lab(r)]), st.race)}</select></label>
    ${variants.length ? `<label class="f">Variante<select id="f-subrace" data-k="subrace">${opts(variants.map(v => [v, D.subraces[st.race + '-' + v] ? lab(D.subraces[st.race + '-' + v]) : v]), st.subrace)}</select></label>` : ''}
  </div>
  <p class="hint">Velocità <b>${s.speed} ft</b>${race.scorestxt ? ` · ${esc(race.scorestxt)}` : ''}${race.skillstxt ? ` · Abilità: ${esc(race.skillstxt)}` : ''}</p>
  ${originHtml(s, 'race')}
  <details data-id="trait"${open.has('trait') ? ' open' : ''}><summary>Tratti razziali</summary><div class="trait">${md(s.trait)}</div></details></section>`);

  html.push(`${step('cls', s.classes.length > 1 ? 'Classi' : 'Classe')}${classesHtml(s, D, open)}
  <p class="hint">Dado vita <b>d${cls.die}</b> · Tiri salvezza <b>${cls.saves.join(', ')}</b> · Caratteristica primaria <b>${esc(cls.primaryAbility || '—')}</b>${s.casting && !cls.casterFactor ? ` · Incantatore (${s.casting.ability})` : ''}</p>
  ${choicesHtml(s, D, open)}</section>`);

  html.push(`${step('feats', 'Talenti e aumenti')}
    <p class="hint">${s.asi ? `Hai <b>${s.asi}</b> aumenti disponibili: ognuno è +1/+1 (o +2) oppure un talento.` : 'Nessun aumento di caratteristica a questo livello.'}</p>
    <div class="slots-list">${s.featSlots.map(sl => featSlotHtml(sl, D, s)).join('')}</div>
    <div class="btns"><button type="button" class="btn small" data-act="addFeat">Aggiungi talento extra</button></div></section>`);

  html.push(`${step('bg', 'Background')}<div class="row">
    <label class="f">Background<select id="f-bg" data-k="background">${opts(byName(D.backgrounds).map(([k, b]) => [k, lab(b)]), st.background)}</select></label>
    ${(bg.variants || []).length ? `<label class="f">Variante<select id="f-bgvar" data-k="bgVariant">${opts(bg.variants.filter(v => D.bgVariants?.[v]).map(v => [v, lab(D.bgVariants[v])]), st.bgVariant, '— nessuna —')}</select></label>` : ''}
  </div>
  ${originHtml(s, 'bg')}
  <p class="hint">Abilità <b>${bg.skills.join(', ') || '—'}</b>${bg.tools.length ? ` · Strumenti <b>${esc(bg.tools.join(', '))}</b>` : ''} · ${bg.gold} mo</p></section>`);

  html.push(`${step('pers', 'Personalità e note')}
    <p class="hint">Scegli dalle tabelle del background ${esc(bg.name)}, tira il dado oppure scrivi a mano.</p>
    <div class="pers">${PERS.map(([k, label, die]) => `<div class="pers-row">
      <label class="f" for="f-p-${k}">${label}</label>
      <div class="pers-ctl"><select id="f-ps-${k}" data-pers="${k}" aria-label="${label}: scegli dalla tabella">${opts((bg[k] || []).map((x, i) => [i, `${i + 1}. ${persText(x).slice(0, 70)}${persText(x).length > 70 ? '…' : ''}`]), '', `— tabella ${die} —`)}</select>
      <button type="button" class="btn small" data-act="rollPers" data-f="${k}" aria-label="Tira ${die} per ${label}">Tira ${die}</button></div>
      <textarea id="f-p-${k}" class="prose" data-k="personality.${k}" rows="2">${esc(st.personality[k])}</textarea></div>`).join('')}</div>
    <label class="f" for="f-notes">Aspetto, storia, appunti</label>
    <textarea id="f-notes" class="prose" data-k="notes" rows="4" placeholder="Com'è fatto, da dove viene, cosa cerca…">${esc(st.notes)}</textarea></section>`);

  const pbCost = E.pointBuyCost(st.base.map(Number));
  html.push(`${step('abil', 'Caratteristiche')}<div class="row">
    <label class="f">Metodo<select id="f-method" data-k="method">${opts([['standard', 'Serie standard (15,14,13,12,10,8)'], ['pointbuy', 'Acquisto a punti (27)'], ['roll', 'Tiro 4d6 (scarta il più basso)'], ['manual', 'Manuale']], st.method)}</select></label>
    </div>
    <div class="scores">${E.ABIL.map((a, i) => `<label class="f">${a}${st.method === 'standard'
      ? `<select id="f-base-${i}" data-k="base.${i}" data-num>${opts(E.STANDARD_ARRAY.map(v => [v, v]), st.base[i])}</select>`
      : `<input id="f-base-${i}" type="number" data-k="base.${i}" data-num value="${st.base[i]}" min="${st.method === 'pointbuy' ? 8 : 3}" max="${st.method === 'pointbuy' ? 15 : 20}">`}</label>`).join('')}</div>
    ${st.method === 'pointbuy' ? `<p class="hint">Punti spesi: <span id="pb-counter" class="counter${pbCost > 27 || isNaN(pbCost) ? ' over' : ''}">${isNaN(pbCost) ? 'valori fuori 8–15' : pbCost + ' / 27'}</span></p>` : ''}
    ${st.method === 'roll' ? `<div class="btns"><button type="button" class="btn small" data-act="roll">Tira 6 × 4d6</button></div>` : ''}
    ${st.method === 'standard' && new Set(st.base.map(String)).size < 6 ? `<p class="hint error">Ogni valore della serie standard va usato una sola volta.</p>` : ''}
    <details data-id="adjust"${open.has('adjust') || st.adjust.some(Number) ? ' open' : ''}><summary>Regolazioni manuali</summary>
    <div class="scores adjust">${E.ABIL.map((a, i) => `<label class="f">${a}<input id="f-adj-${i}" type="number" data-k="adjust.${i}" data-num value="${st.adjust[i]}" min="-10" max="10"></label>`).join('')}</div></details>
    <p class="hint">Totale calcolato: ${E.ABIL.map((a, i) => `${a} <b class="num">${s.abilities.total[i]}</b>`).join(' · ')}</p></section>`);

  const sp = s.skillPicks, sug = new Set([...(sp.classOptions || []), ...(sp.raceOptions || [])]);
  html.push(`${step('skills', 'Abilità', `<span class="counter${sp.used > sp.allowed ? ' over' : ''}">${sp.used} / ${sp.allowed}</span>`)}
    <p class="hint">${esc(cls.skillstxt)}${race.skillstxt ? ' · ' + esc(race.skillstxt) : ''}.</p>
    <p class="hint">Prima casella: competenza. Seconda casella: maestria (raddoppia il bonus). Le voci sottolineate sono quelle suggerite dalla classe.</p>
    <div class="picks">${s.skills.map(k => `<div class="pick${k.fixed ? ' locked' : ''}${sug.has(k.name) ? ' suggest' : ''}">
      <input type="checkbox" id="sk-${esc(k.name)}" data-list="skills" value="${esc(k.name)}"${k.prof ? ' checked' : ''}${k.fixed ? ' disabled' : ''} aria-label="Competenza ${esc(k.name)}">
      <input type="checkbox" id="ex-${esc(k.name)}" data-list="expertise" value="${esc(k.name)}"${k.exp ? ' checked' : ''}${k.prof ? '' : ' disabled'} aria-label="Maestria ${esc(k.name)}">
      <label class="lbl" for="sk-${esc(k.name)}">${esc(k.name)}</label><span class="ab">${k.abName}</span></div>`).join('')}</div></section>`);

  html.push(`${step('equip', 'Equipaggiamento')}<div class="row">
    <label class="f">Armatura<select id="f-armour" data-k="armour">${opts(Object.entries(D.armour).map(([k, a]) => [k, `${a.name} (CA ${a.ac}, ${a.type})`]), st.armour, 'Nessuna')}</select></label>
    <label class="f">Aggiungi arma<select id="f-addweapon" data-act="addWeapon">${opts(byName(D.weapons).map(([k, w]) => [k, w.name + (w.type ? ` · ${w.type}` : '')]), '', '— scegli —')}</select></label>
    <label class="pick end"><input type="checkbox" id="f-shield" data-k="shield"${st.shield ? ' checked' : ''}>Scudo (+2 CA)</label>
    <label class="f">PF extra<input id="f-hpbonus" type="number" data-k="hpBonus" data-num value="${st.hpBonus}"></label>
  </div>
  <div class="chips">${st.weapons.map((k, i) => `<span class="chip">${esc(D.weapons[k].name)}<button type="button" data-act="rmWeapon" data-i="${i}" aria-label="Rimuovi ${esc(D.weapons[k].name)}">×</button></span>`).join('') || '<span class="hint">Nessuna arma.</span>'}</div>
  <p class="hint">Dotazione del background: ${esc(bg.equipment.join(', '))}.</p>
  ${equipmentHtml(s, D, bg, open)}</section>`);

  if (s.castings.length) {
    const sl = s.spellSlots;
    html.push(`${step('spells', 'Incantesimi')}
      <p class="hint">Slot totali: ${sl.slots.length ? sl.slots.map((n, i) => `${n}×${i + 1}°`).join(', ') : 'nessuno'}${sl.pact ? ` · Patto: ${sl.pact.count}×${sl.pact.level}°` : ''}</p>
      <div class="row spell-filter">
        <label class="f">Cerca<input id="f-spellq" type="search" data-filter="q" value="${esc(spellQ)}" placeholder="nome o effetto…"></label>
        <label class="f">Scuola<select id="f-spellschool" data-filter="school">${opts(Object.entries(SCHOOL), spellSchool, 'Tutte')}</select></label>
        <label class="pick end"><input type="checkbox" id="f-spellritual" data-filter="ritual"${spellRitual ? ' checked' : ''}>Solo rituali</label>
        <label class="pick end"><input type="checkbox" id="f-spellchosen" data-filter="chosen"${spellChosen ? ' checked' : ''}>Solo scelti</label>
      </div>
      <p class="hint" id="spell-count" role="status"></p>
      ${s.castings.map((cs, i) => spellBlock(cs, i, s, D, open)).join('')}</section>`);
  }

  if (s.grants.length) html.push(`${step('bonus', 'Incantesimi bonus')}
    <p class="hint">Da razza, talenti e privilegi speciali.</p>
    <div class="grants">${s.grants.map(g => grantHtml(g, D)).join('')}</div></section>`);

  const crs = Object.entries(D.creatures || {}).sort((a, b) => a[1].name.localeCompare(b[1].name));
  const ws = s.wildShape;
  html.push(`${step('pets', 'Compagni e forme')}
    ${s.companionSlots.length ? s.companionSlots.map(sl => sl.kind === 'type'
      ? `<div class="row"><label class="f">${esc(sl.name)} <span class="ab">da ${esc(sl.from)}</span><select id="f-comp-${esc(sl.type)}" data-comp="${esc(sl.id)}">${opts(sl.forms.map(f => [f.key, `${f.name} · GS ${f.cr} · ${f.type}`]), sl.chosen, `— scegli (${sl.forms.length} forme) —`)}</select></label></div>`
      : `<p class="hint"><b>${esc(sl.name)}</b> (da ${esc(sl.from)}): scheda inclusa automaticamente.</p>`).join('')
      : '<p class="hint">Nessun compagno concesso da privilegi o incantesimi.</p>'}
    <div class="row"><label class="f">Altra creatura (scelta libera, col DM)<select id="f-companion" data-k="companion">${opts(crs.map(([k, m]) => [k, `${m.name} · GS ${m.cr} · ${m.type}`]), st.companion, '— nessuna —')}</select></label></div>
    ${ws ? `<p class="hint">Forma selvatica (druido ${ws.level}${ws.moon ? ', Circolo Luna' : ''}): GS ≤ ${ws.maxCR}${ws.tempHP != null ? ` · ${ws.tempHP} PF temp.` : ''}.</p>
      ${ws.known ? `<details class="xc" data-id="wildforms"${open.has('wildforms') ? ' open' : ''}><summary>Forme conosciute <span class="counter${ws.chosen.length > ws.known ? ' over' : ''}">${ws.chosen.length} / ${ws.known}</span></summary>
        <div class="picks">${ws.forms.map(f => `<label class="pick"><input type="checkbox" data-list="wildForms" value="${esc(f.key)}"${ws.chosen.includes(f.key) ? ' checked' : ''}>${esc(f.name)} <span class="ab">GS ${esc(f.cr)}</span></label>`).join('')}</div></details>`
        : `<p class="hint">Regole 2014: qualsiasi bestia già vista entro questi limiti.</p>`}` : ''}</section>`);

  html.push(`${step('save', 'Salva e condividi')}
    <p class="hint">Il personaggio si salva in automatico in questo browser.</p>
    <div class="btns"><button type="button" class="btn primary" data-act="copy">Copia JSON</button>
    <button type="button" class="btn" data-act="import">Importa dal testo</button>
    <label class="btn" for="f-file">Apri file .json</label><input type="file" id="f-file" accept=".json,application/json" hidden>
    <button type="button" class="btn danger" data-act="reset">${resetArmed ? 'Conferma: cancella tutto' : 'Nuovo personaggio'}</button></div>
    <textarea id="f-json" aria-label="JSON del personaggio" placeholder="Incolla qui il JSON di un personaggio…"></textarea>
    <p class="hint" id="io-msg" role="status"></p></section>`);

  const nav = `<nav class="stepnav" aria-label="Passi della creazione">${steps.map(([id, l], i) => `<button type="button" data-goto="step-${id}" title="${esc(l)}"><span class="n">${String(i + 1).padStart(2, '0')}</span> ${esc(l)}</button>`).join('')}</nav>`;
  $('#builder').innerHTML = nav + html.join('');
  applySpellFilter();
}

function profsHtml(s) {
  const line = (label, list) => list && list.length ? `<dt>${label}</dt><dd>${list.map(esc).join(', ')}</dd>` : '';
  const senses = Object.entries(s.vision).map(([n, r]) => r ? `${n} ${r} ft` : n);
  const acts = {}; s.actions.forEach(a => (acts[ACTION_IT[a.type] || a.type] ||= []).push(a.name));
  const notes = [...new Map(s.notes.map(n => [n.text, n])).values()];
  return `<div class="cols">
    <div class="sec"><h3>Competenze</h3><dl class="pers-list">${line('Armature', s.profs.armor)}${line('Armi', s.profs.weapons)}${line('Strumenti', s.profs.tools)}${line('Lingue', s.profs.languages)}</dl></div>
    <div class="sec"><h3>Difese e sensi</h3><dl class="pers-list">${line('Resistenze', s.defenses.resist)}${line('Immunità', s.defenses.immune)}${line('Vantaggio ai TS contro', s.defenses.adv)}${line('Note sui TS', s.defenses.notes)}${line('Sensi', senses)}
      ${s.acConditional.length ? line('CA condizionale (non applicata)', s.acConditional) : ''}</dl>${!s.defenses.resist.length && !senses.length && !s.defenses.adv.length ? '<p class="hint">Nessuna.</p>' : ''}</div>
  </div>
  ${s.actions.length ? `<div class="sec"><h3>Azioni speciali</h3><dl class="pers-list">${Object.entries(acts).map(([t, l]) => line(t, [...new Set(l)])).join('')}</dl></div>` : ''}
  ${notes.length ? `<div class="sec"><details class="feat"><summary>Note dalle regole (${notes.length})</summary><ul class="rule-notes">${notes.map(n => `<li>${esc(n.text)} <span class="ab">${esc(n.from)}</span></li>`).join('')}</ul></details></div>` : ''}`;
}

function statBlock(m) {
  const mod = v => E.sign(Math.floor((v - 10) / 2));
  return `<div class="statblock"><b>${esc(m.name)}</b> <span class="ab">${esc([m.type, 'GS ' + m.cr, abbr(m)].filter(Boolean).join(' · '))}</span>
    <div class="sb-line">CA ${esc(m.ac)}${m.acText ? ` <span class="ab">(${esc(m.acText)})</span>` : ''} · PF ${esc(m.hp)}${m.hd && m.hd[0] ? ` (${m.hd[0]}d${m.hd[1]})` : ''} · Velocità ${esc(m.speed)}${m.pb ? ` · Competenza +${m.pb}` : ''}</div>
    <div class="sb-scores">${E.ABIL.map((a, i) => `<span><b>${a}</b> ${m.scores?.[i] ?? '—'} (${mod(m.scores?.[i] ?? 10)})</span>`).join('')}</div>
    ${m.senses ? `<div class="sb-line">${esc(m.senses)}</div>` : ''}
    ${(m.attacks || []).map(a => `<div class="sb-line"><b>${esc(a.name)}</b>: ${esc(Array.isArray(a.damage) ? `${a.damage[0]}d${a.damage[1]} ${a.damage[2]}` : '')} ${esc(a.range || '')}${a.desc ? ' — ' + esc(a.desc) : ''}</div>`).join('')}
    ${(m.traits || []).slice(0, 6).map(t => `<div class="sb-line"><i>${esc(t.name)}.</i> ${esc(String(t.desc || '').replace(/\[THIS\]/g, m.name))}</div>`).join('')}</div>`;
}

function inventoryHtml(s, D) {
  const inv = s.inventory;
  if (!inv.rows.length && !inv.gpValue) return '';
  return `<div class="sec"><h3>Equipaggiamento <span class="hint">${inv.total} lb · capacità ${inv.capacity} lb · ${inv.status}</span></h3>
    <div class="tbl-wrap"><table><thead><tr><th>Oggetto</th><th>Q.tà</th><th>Peso</th></tr></thead><tbody>
    ${inv.rows.map(r => `<tr><td>${esc(r.name)}${r.kind === 'magic' ? ` <span class="badge">magico${r.attuned ? ', in sintonia' : ''}</span>` : ''}</td><td class="num">${r.qty}</td><td class="num">${Math.round(r.qty * r.weight * 100) / 100}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint">Monete: ${['pp', 'gp', 'ep', 'sp', 'cp'].filter(k => inv.coins[k]).map(k => `${inv.coins[k]} ${{ cp: 'mr', sp: 'ma', ep: 'me', gp: 'mo', pp: 'mp' }[k]}`).join(', ') || 'nessuna'} · ingombro (variante): ${inv.encumbered} / ${inv.heavy} lb</p></div>`;
}

function petsHtml(s, D) {
  const ws = s.wildShape;
  const comps = s.companions.map(({ slot, block }) => `<div class="pet"><div class="ab">${esc(slot.name)}${slot.from ? ' · da ' + esc(slot.from) : ''}</div>${statBlock(block)}
    ${block.notes?.length ? `<details class="feat"><summary>Regole del ${esc(slot.name)}</summary><ul class="rule-notes">${block.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul></details>` : ''}</div>`).join('');
  const known = ws?.known ? ws.forms.filter(f => ws.chosen.includes(f.key)) : null;
  return `${comps ? `<div class="sec"><h3>Compagni</h3><div class="pets">${comps}</div></div>` : ''}
    ${ws ? `<div class="sec"><details class="feat"${known?.length ? ' open' : ''}><summary>Forma selvatica · GS ≤ ${ws.maxCR}${ws.noFly ? ', no volo' : ''}${ws.noSwim ? ', no nuoto' : ''}${ws.tempHP != null ? ` · ${ws.tempHP} PF temp.` : ''} · ${known ? `${known.length}/${ws.known} forme conosciute` : `${ws.forms.length} forme`}</summary>
      <div class="tbl-wrap"><table><thead><tr><th>Bestia</th><th>GS</th><th>CA</th><th>PF</th><th>Velocità</th></tr></thead><tbody>
      ${(known || ws.forms).map(f => `<tr><td>${esc(f.name)}</td><td class="num">${esc(f.cr)}</td><td class="num">${esc(f.ac)}</td><td class="num">${esc(f.hp)}</td><td>${esc(f.speed)}</td></tr>`).join('') || '<tr><td colspan="5" class="hint">Scegli le forme conosciute nel passo «Compagni e forme».</td></tr>'}</tbody></table></div></details></div>` : ''}`;
}

// Tactical Play Deck Component
function renderPlayCodexDeck(s, D) {
  const maxHp = s.hp;
  const curHp = Math.min(st.hpCurrent ?? maxHp, maxHp);
  const tempHp = +st.hpTemp || 0;
  const hpPct = maxHp ? Math.max(0, Math.min(1, curHp / maxHp)) : 0;
  const hpClass = hpPct <= 0.25 ? 'danger' : hpPct <= 0.5 ? 'warn' : '';
  const condList = ['Concentrazione', 'Avvelenato', 'Trattenuto', 'Schivata', 'Vantaggio', 'Invisibile', 'Prono', 'Stordito', 'Privo di sensi'];
  const conds = (st.conditions || []).map(c => c === 'Prone' ? 'Prono' : c === 'Privo di Sensi' ? 'Privo di sensi' : c);
  const sl = s.spellSlots, sg = E.sign;
  const otherSpeeds = Object.entries(s.speeds).filter(([k]) => k !== 'walk').map(([k, v]) => `${SPEED_IT[k] || k} ${v}`);
  const vital = (k, v, sub, title) => `<div class="vital-box"${title ? ` title="${esc(title)}"` : ''}><span class="k">${k}</span><span class="v">${v}</span>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
  const pip = (act, lv, i, used, label) => `<button type="button" class="slot-pip${used ? ' used' : ''}" data-act="${act}"${lv ? ` data-lv="${lv}"` : ''} data-idx="${i}" aria-pressed="${used}" aria-label="${label} ${i + 1}: ${used ? 'usato' : 'disponibile'}"></button>`;

  return `<div class="play-deck">
    <div class="vitals-card">
      <div class="vitals-grid">
        <div class="vital-box hp-box">
          <div class="hp-top"><span class="k">Punti ferita</span>${tempHp ? `<span class="hp-temp">+${tempHp} temporanei</span>` : ''}</div>
          <div class="hp-now"><span class="v" id="hp-current">${curHp}</span><span class="max">/ ${maxHp}</span></div>
          <div class="hp-bar-wrap" role="meter" aria-label="Punti ferita" aria-valuemin="0" aria-valuemax="${maxHp}" aria-valuenow="${curHp}"><div class="hp-bar ${hpClass}" style="transform:scaleX(${hpPct})"></div></div>
          <div class="hp-controls">
            <button type="button" class="hp-btn minus" data-act="hp-mod" data-n="-5" aria-label="Togli 5 PF">−5</button>
            <button type="button" class="hp-btn minus" data-act="hp-mod" data-n="-1" aria-label="Togli 1 PF">−1</button>
            <button type="button" class="hp-btn plus" data-act="hp-mod" data-n="1" aria-label="Aggiungi 1 PF">+1</button>
            <button type="button" class="hp-btn plus" data-act="hp-mod" data-n="5" aria-label="Aggiungi 5 PF">+5</button>
          </div>
          <div class="hp-controls">
            <span class="hp-amount">
              <input type="number" id="play-hp-inp" min="0" inputmode="numeric" placeholder="PF" aria-label="Quantità di punti ferita">
              <button type="button" class="btn small" data-act="hp-apply-dmg">Danno</button>
              <button type="button" class="btn small" data-act="hp-apply-heal">Cura</button>
              <button type="button" class="btn small" data-act="hp-apply-temp" title="Imposta i PF temporanei">Temp.</button>
            </span>
          </div>
        </div>
        <div class="vital-stats">
          ${vital('Classe armatura', s.ac, esc([s.acNote + (st.shield ? ' + scudo' : ''), ...s.acParts].filter(Boolean).join(', ')) + (s.acConditional.length ? ' *' : ''), s.acConditional.length ? 'Condizionali: ' + s.acConditional.join('; ') : '')}
          ${vital('Iniziativa', sg(s.initiative))}
          ${vital('Velocità', `${s.speed}<small>ft</small>`, esc([`${Math.round(s.speed * 0.3 * 10) / 10} m`, ...otherSpeeds].join(' · ')))}
          ${vital('Competenza', sg(s.pb))}
          ${vital('Percezione passiva', s.passivePerception)}
          ${vital('Dadi vita', `${s.level - (st.spentHitDice || 0)}<small>/ ${s.level}</small>`, esc(s.hitDice))}
        </div>
      </div>

      <div class="conditions-bar" role="group" aria-label="Ispirazione e condizioni">
        <button type="button" class="condition-chip" data-act="toggle-insp" aria-pressed="${!!st.inspiration}">${ic('star')} Ispirazione</button>
        ${condList.map(cd => `<button type="button" class="condition-chip" data-act="toggle-cond" data-c="${esc(cd)}" aria-pressed="${conds.includes(cd)}">${esc(cd)}</button>`).join('')}
      </div>

      <div class="rest-deck">
        <button type="button" class="btn small" data-act="short-rest">${ic('coffee')} Riposo breve</button>
        <button type="button" class="btn small" data-act="long-rest">${ic('tent')} Riposo lungo</button>
        <p class="status-line" id="rest-msg"></p>
      </div>
    </div>

    ${s.attacks.length ? `<section class="sec" aria-labelledby="h-atk">
      <h3 id="h-atk">${ic('sword')} Attacchi</h3>
      <div class="play-attacks">
        ${s.attacks.map(a => `<div class="attack-card">

    ${s.castings.length && (sl.slots.length || sl.pact) ? `<section class="sec" aria-labelledby="h-slots">

            <span class="slot-count">${n - spent} / ${n}</span>
          </div>`;
        }).join('')}
        ${sl.pact ? (() => { const spent = Math.min(st.spentPact || 0, sl.pact.count); return `<div class="slot-row" role="group" aria-label="Slot del patto">
          <span class="slot-label">Patto (${sl.pact.level}°)</span>
          <div class="slot-pips">${Array.from({ length: sl.pact.count }, (_, k) => pip('toggle-pact', 0, k, k < spent, 'Slot del patto')).join('')}</div>
          <span class="slot-count">${sl.pact.count - spent} / ${sl.pact.count}</span>
        </div>`; })() : ''}
      </div>
    </section>` : ''}

    ${s.limited.length ? `<section class="sec" aria-labelledby="h-res">
      <h3 id="h-res">${ic('hourglass')} Risorse</h3>
      <div class="res-list">
        ${s.limited.map(l => {
          const maxUses = +l.uses || 1;
          const spent = st.spentLimited?.[l.name] || 0;
          const left = Math.max(0, maxUses - spent);
          return `<div class="res-card">
            <div>
              <div class="res-name">${esc(l.name)}</div>
              <div class="hint">${esc([l.recovery, l.additional].filter(Boolean).join(' · '))}</div>
            </div>
            <div class="res-ctrl">
              <button type="button" class="hp-btn minus" data-act="res-use" data-name="${esc(l.name)}" aria-label="Usa ${esc(l.name)}"${left === 0 ? ' disabled' : ''}>−1</button>
              <span class="counter${left === 0 ? ' over' : ''}" aria-label="${left} usi rimasti su ${maxUses}">${left} / ${maxUses}</span>
              <button type="button" class="hp-btn plus" data-act="res-rec" data-name="${esc(l.name)}" aria-label="Recupera ${esc(l.name)}"${spent === 0 ? ' disabled' : ''}>+1</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>` : ''}
  </div>`;
}

function renderSheet() {

  const tabs = `<div class="sheet-bar">
    <div class="tabs" role="tablist" aria-label="Visualizzazione Scheda">

      <button type="button" role="tab" id="tab-bib" aria-controls="panel" data-view="bib" aria-selected="${view === 'bib'}" tabindex="${view === 'bib' ? 0 : -1}">Bibliografia</button>
    </div>
    <button type="button" class="btn small to-builder" data-act="jump-forge">${ic('hammer')} Modifica nella Forgia</button>

  const panelWrap = content => `${tabs}<div role="tabpanel" id="panel" aria-labelledby="tab-${view}" class="panel">${content}</div>`;

  if (view === 'bib') {
    $('#sheet').innerHTML = panelWrap(renderBib(s));
    return;
  }

  const groups = [];
  s.features.forEach(f => { let g = groups.find(x => x.source === f.source); if (!g) groups.push(g = { source: f.source, items: [] }); g.items.push(f); });
  const pers = PERS.filter(([k]) => st.personality[k]);

    ${renderPlayCodexDeck(s, D)}

    <div class="abil" role="group" aria-label="Caratteristiche">${E.ABIL.map((a, i) => `<div class="ab-tile" title="${E.ABIL_FULL[i]} ${s.abilities.total[i]}"><span class="k">${E.ABIL_FULL[i].slice(0, 3).toUpperCase()}</span><span class="m">${sg(s.abilities.mods[i])}</span><span class="s">${s.abilities.total[i]}</span></div>`).join('')}</div>
    <div class="cols">
      <div class="sec"><h3>Tiri salvezza</h3><ul class="list">${s.saves.map(x => `<li><span class="dot${x.prof ? ' on' : ''}"></span><span class="ab">${x.ab}</span><span>${E.ABIL_FULL[E.ABIL.indexOf(x.ab)]}</span><span class="v">${sg(x.total)}</span></li>`).join('')}</ul></div>
      <div class="sec"><h3>Abilità</h3><ul class="list">${s.skills.map(x => `<li><span class="dot${x.exp ? ' exp' : x.prof ? ' on' : ''}"></span><span class="ab">${x.abName}</span><span>${esc(x.name)}</span><span class="v">${sg(x.total)}</span></li>`).join('')}</ul></div>
    </div>
    ${s.castings.length ? `<div class="sec"><h3>${ic('book')} Incantesimi</h3>
      ${!sl.slots.length && !sl.pact ? '<p class="hint">Nessuno slot a questo livello.</p>' : ''}
      ${s.castings.map(cs => `<div class="caster-line"><span>${esc(cs.name)} · caratteristica <b>${cs.ability}</b></span><span>CD tiro salvezza <b>${cs.dc}</b></span><span>Attacco <b>${sg(cs.attack)}</b></span></div>
        ${spellRows(cs).length ? `<div class="tbl-wrap"><table><thead><tr><th>Liv</th><th>Incantesimo</th><th>Tempo</th><th>Gittata</th><th>Effetto</th></tr></thead><tbody>
        ${spellRows(cs).map(([k, x]) => `<tr><td class="num">${x.level || 'T'}</td><td>${esc(x.name)}${cs.alwaysPrepared.includes(k) ? ' <span class="badge">sempre</span>' : ''}</td><td>${esc(x.time)}</td><td>${esc(x.range)}</td><td>${esc(s.spellText[k] || x.desc)}${s.spellText[k] ? ' <span class="badge">modificato</span>' : ''}</td></tr>`).join('')}</tbody></table></div>` : ''}`).join('')}</div>` : ''}
    ${s.grants.some(g => g.chosen.length) ? `<div class="sec"><h3>Incantesimi bonus</h3><div class="tbl-wrap"><table><thead><tr><th>Incantesimo</th><th>Da</th><th>Uso</th><th>Effetto</th></tr></thead><tbody>
      ${s.grants.flatMap(g => g.chosen.map(k => `<tr><td>${esc(D.spells[k]?.name || k)}${D.spells[k]?.level ? ` <span class="ab">${D.spells[k].level}°</span>` : ''}</td><td>${esc(g.from)}</td><td>${esc([g.note, g.dc ? 'CD ' + g.dc : ''].filter(Boolean).join(' · ') || '—')}</td><td>${esc(D.spells[k]?.desc || '')}</td></tr>`)).join('')}</tbody></table></div></div>` : ''}
    ${profsHtml(s)}
    ${inventoryHtml(s, D)}
    ${petsHtml(s, D)}
    <div class="sec"><div class="sec-head"><h3>Privilegi e tratti</h3>
      <span class="btns"><button type="button" class="btn small" data-feat="open">Espandi tutto</button><button type="button" class="btn small" data-feat="close">Comprimi</button></span></div>
      ${groups.map(g => `<div class="feat-group"><h4>${esc(g.source)} <span class="hint">${g.items.length}</span></h4>${g.items.map(f => `<details class="feat"><summary><span class="lv">L${f.level}</span><span>${esc(f.name)}</span></summary>

    ${pers.length || st.notes ? `<div class="sec"><h3>Personalità</h3><dl class="pers-list">${pers.map(([k, label]) => `<dt>${label}</dt><dd>${esc(st.personality[k])}</dd>`).join('')}
      ${st.notes ? `<dt>Aspetto e storia</dt><dd class="notes">${esc(st.notes)}</dd>` : ''}</dl></div>` : ''}`);
}

function renderBib(s) {
  const b = E.bibliography(st, data());

  return `<div class="sh-head"><h2>Bibliografia</h2>
      <div class="meta">${esc(st.name || 'Senza nome')} · ${esc(s.title)} <span class="badge gold">${n} riferimenti</span></div></div>

    ${b.books.map(k => `<section class="bib-book"><h3>${esc(k.name)} ${k.url ? `<a href="${esc(k.url)}" target="_blank" rel="noopener">fonte online</a>` : ''}</h3>
      <ul class="bib">${k.entries.map(e => `<li><span class="pg">${e.page ? 'p. ' + e.page : '—'}</span><span>${esc(e.name)}</span><span class="kind">${esc(e.kind)}</span></li>`).join('')}</ul></section>`).join('')}
    <section class="bib-book"><h3>Regole di base applicate dal calcolo</h3>
      <p class="cite">${esc(b.coreBook.name)}: le schede MPMB non indicano le pagine per queste sezioni.</p>
