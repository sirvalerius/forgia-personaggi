}

// Sources Dialog
const TYPE_IT = { races: 'Razza', subraces: 'Variante', classes: 'Classe', subclasses: 'Sottoclasse', backgrounds: 'Background', feats: 'Talento', armour: 'Armatura', weapons: 'Arma', spells: 'Incantesimo', feature: 'Privilegio' };
let srcTab = 'books', srcQ = '', bookQ = '';
const IDX = {};

function srcIndex() {
  const ed = st.edition + (st.mixOther ? '+' : '');
  if (!IDX[ed]) {
    const list = E.searchIndex(full()), counts = {};
    list.forEach(e => { if (e.type !== 'feature') new Set(e.src.map(x => x[0])).forEach(c => counts[c] = (counts[c] || 0) + 1); });
    IDX[ed] = { list, counts };
  }
  return IDX[ed];
}
const srcAbbr = code => full().sources?.[code]?.abbr || code;
const refs = src => src.map(([c, p]) => srcAbbr(c) + (p ? ' p. ' + p : '')).join(' · ');
const hl = (text, q) => { const t = esc(text), i = q ? t.toLowerCase().indexOf(esc(q)) : -1; return i < 0 ? t : t.slice(0, i) + '<mark>' + t.slice(i, i + esc(q).length) + '</mark>' + t.slice(i + esc(q).length); };

function updateSrcBtn() {
  const all = Object.keys(full().sources || {}), inc = all.filter(c => !st.excludedSources.includes(c));
  $('#src-open').innerHTML = `${ic('book')}<span class="src-label">Fonti</span> <span class="num">${inc.length}/${all.length}</span>`;
  $('#src-open').setAttribute('aria-label', `Fonti: ${inc.length} incluse su ${all.length}`);
}

function srcRow(code, s, q) {
  const n = srcIndex().counts[code] || 0, on = !st.excludedSources.includes(code);
  return `<label class="src-row${n ? '' : ' empty'}"><input type="checkbox" data-code="${esc(code)}"${on ? ' checked' : ''}>
    <span>${hl(s.name, q)}</span><span class="ct" title="Elementi nel builder">${n || '—'}</span>
    <span></span><span class="ab">${hl(s.abbr || code, q)}${s.date ? ' · ' + esc(String(s.date).slice(0, 4)) : ''}</span></label>`;
}

function renderBookList() {
  const S = full().sources || {}, q = bookQ.trim().toLowerCase(), groups = {};
  Object.entries(S).filter(([k, s]) => !q || (s.name + ' ' + (s.abbr || k) + ' ' + (s.group || '')).toLowerCase().includes(q))
    .sort((a, b) => String(a[1].date || '').localeCompare(String(b[1].date || '')))
    .forEach(([k, s]) => (groups[s.group || 'Altro'] ||= []).push([k, s]));
  $('#src-list').innerHTML = Object.entries(groups).map(([g, rows]) => {
    const on = rows.filter(([k]) => !st.excludedSources.includes(k)).length;
    return `<fieldset class="src-group"><legend><input type="checkbox" data-group="${esc(g)}" aria-label="Tutto il gruppo ${esc(g)}"${on === rows.length ? ' checked' : ''}${on && on < rows.length ? ' data-mixed' : ''}>
      ${esc(g === 'default' ? 'Script personalizzati' : g)} <span class="hint">${on}/${rows.length} incluse</span></legend>
      <div class="src-rows">${rows.map(([k, s]) => srcRow(k, s, q)).join('')}</div></fieldset>`;
  }).join('') || '<p class="hint">Nessun libro corrisponde alla ricerca.</p>';
  document.querySelectorAll('#src-list [data-mixed]').forEach(x => x.indeterminate = true);
}

function renderFind() {
  const q = srcQ.trim().toLowerCase(), box = $('#src-results');
  if (q.length < 2) { box.innerHTML = '<p class="hint">Scrivi almeno 2 lettere: il nome di un incantesimo, privilegio, sottoclasse, razza o talento.</p>'; return; }
  const S = full().sources || {};
  const books = Object.entries(S).filter(([k, s]) => (s.name + ' ' + (s.abbr || k)).toLowerCase().includes(q));
  const bookCodes = new Set(books.map(([k]) => k));
  const { list } = srcIndex();
  const hits = list.filter(e => e.text.includes(q) || e.src.some(([c]) => bookCodes.has(c)))
    .sort((a, b) => (b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) || (b.text.includes(q) - a.text.includes(q)) || a.name.localeCompare(b.name));
  const ex = st.excludedSources, exItems = st.excludedItems;
  const row = e => {
    const itemOff = exItems.includes(e.owner || e.type + ':' + e.key);
    const srcOff = e.src.length && e.src.every(([c]) => ex.includes(c));
    const state = itemOff ? '<span class="pill off">Elemento escluso</span>' : srcOff ? '<span class="pill off">Fonte esclusa</span>' : '<span class="pill ok">Disponibile</span>';
    const acts = [
      ...(srcOff ? [...new Set(e.src.map(x => x[0]))].map(c => `<button type="button" class="btn small" data-inc="${esc(c)}">Includi ${esc(srcAbbr(c))}</button>`) : []),
      e.type === 'feature' ? '' : itemOff ? `<button type="button" class="btn small" data-initem="${esc(e.type + ':' + e.key)}">Riammetti</button>`
        : `<button type="button" class="btn small" data-exitem="${esc(e.type + ':' + e.key)}">Escludi elemento</button>`,
    ].join('');
    return `<li class="hit"><div><b>${hl(e.name, q)}</b> <span class="ty">${TYPE_IT[e.type] || e.type}${e.parent ? ' · ' + hl(e.parent, q) : ''}</span></div>
      <div class="refs">${esc(refs(e.src)) || 'senza fonte'}</div><div class="act">${state}${acts}</div></li>`;
  };
  box.innerHTML = (books.length ? `<fieldset class="src-group"><legend>Libri</legend><div class="src-rows">${books.map(([k, s]) => srcRow(k, s, q)).join('')}</div></fieldset>` : '')
    + `<p class="hint" role="status">${hits.length} elementi trovati${hits.length > 80 ? ', mostro i primi 80' : ''}.</p>`
    + `<ul class="hits">${hits.slice(0, 80).map(row).join('')}</ul>`;
}

function renderSources() {
  $('#src-tabs').innerHTML = [['books', 'Libri'], ['find', 'Cerca']].map(([v, l]) => `<button type="button" role="tab" data-srctab="${v}" aria-selected="${srcTab === v}" tabindex="${srcTab === v ? 0 : -1}">${l}</button>`).join('');
  $('#src-body').innerHTML = srcTab === 'books'
    ? `<label class="pick mix-toggle"><input type="checkbox" id="src-mix" data-srcmix${st.mixOther ? ' checked' : ''}> <span><b>Campagna mista:</b> includi anche opzioni ${otherEd()} (specie, classi, sottoclassi, background, talenti, incantesimi, armi). Ogni elemento segue le regole della sua edizione.</span></label>
      <div class="src-tools"><label class="f">Filtra libri<input id="src-bookq" type="search" data-srcin="book" value="${esc(bookQ)}" placeholder="nome, sigla o gruppo…"></label>
        <button type="button" class="btn small" data-src="all">Includi tutto</button><button type="button" class="btn small" data-src="noua">Solo pubblicati (no UA)</button><button type="button" class="btn small" data-src="srd">Solo SRD</button></div>
      ${st.excludedItems.length ? `<p class="hint">${st.excludedItems.length} elementi esclusi singolarmente. <button type="button" class="btn small" data-src="clearitems">Riammettili tutti</button></p>` : ''}
      <div id="src-list"></div>`
    : `<div class="src-tools"><label class="f">Cerca nelle fonti<input id="src-q" type="search" data-srcin="find" value="${esc(srcQ)}" placeholder="es. chronurgy, misty step, Wildemount…"></label></div>
      <div id="src-results"></div>`;
  srcTab === 'books' ? renderBookList() : renderFind();
}

function sourcesChanged() {
  render();
  if (srcTab === 'books') renderBookList(); else renderFind();
}

$('#src-open').addEventListener('click', () => { const d = $('#src-dlg'); renderSources(); d.showModal ? d.showModal() : d.setAttribute('open', ''); $(srcTab === 'books' ? '#src-bookq' : '#src-q')?.focus(); });
const dlg = $('#src-dlg');
dlg.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.srcin === 'book') { bookQ = t.value; renderBookList(); }
  if (t.dataset.srcin === 'find') { srcQ = t.value; renderFind(); }
});
dlg.addEventListener('change', e => {
  const t = e.target, ex = new Set(st.excludedSources);
  if (t.dataset.srcmix !== undefined) { st.mixOther = t.checked; render(); renderSources(); $('#src-mix')?.focus(); return; }
  if (t.dataset.code) { t.checked ? ex.delete(t.dataset.code) : ex.add(t.dataset.code); }
  else if (t.dataset.group) { Object.entries(full().sources).filter(([, s]) => (s.group || 'Altro') === t.dataset.group).forEach(([k]) => t.checked ? ex.delete(k) : ex.add(k)); }
  else return;
  st.excludedSources = [...ex]; sourcesChanged();
});
dlg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const S = full().sources;
  if (b.dataset.srctab) { srcTab = b.dataset.srctab; renderSources(); $('[data-srctab="' + srcTab + '"]')?.focus(); return; }
  if (b.dataset.src === 'close') { dlg.close ? dlg.close() : dlg.removeAttribute('open'); return; }
  if (b.dataset.src === 'all') st.excludedSources = [];
  else if (b.dataset.src === 'noua') st.excludedSources = E.defaultExcluded(full());
  else if (b.dataset.src === 'srd') st.excludedSources = Object.keys(S).filter(k => !/^SRD/.test(k));
  else if (b.dataset.src === 'clearitems') { st.excludedItems = []; render(); renderSources(); return; }
  else if (b.dataset.inc) st.excludedSources = st.excludedSources.filter(c => c !== b.dataset.inc);
  else if (b.dataset.exitem) st.excludedItems = [...st.excludedItems, b.dataset.exitem];
  else if (b.dataset.initem) st.excludedItems = st.excludedItems.filter(x => x !== b.dataset.initem);
  else return;
  sourcesChanged();
});

const render = () => {
  sanitize();
  renderEdition();
  renderBuilder();
  renderSheet();
  updateSrcBtn();
  save();
};

function setPath(path, val) {
  const ks = path.split('.'), last = ks.pop();
  let o = st; for (const k of ks) o = o[k] ||= {};
  o[last] = val;
}

// Mode Switcher handlers
function setAppLayout(mode) {
  appLayout = mode;
  try { localStorage.setItem('mpmb-layout', mode); } catch { }
  $('#app').dataset.layout = mode === 'split' ? 'split' : mode === 'forge' ? 'forge-only' : 'play-only';
  $$('.nav-btn').forEach(btn => {
    const isAct = btn.dataset.mode === mode;
    btn.classList.toggle('active', isAct);
    btn.setAttribute('aria-pressed', isAct);
  });
}

$('#btn-mode-forge').addEventListener('click', () => setAppLayout('forge'));
$('#btn-mode-play').addEventListener('click', () => setAppLayout('play'));
$('#btn-mode-split').addEventListener('click', () => setAppLayout('split'));
function goTo(id, focusField) {
  if (id === 'sheet' && appLayout === 'forge') setAppLayout('play');
  if ((id === 'builder' || id.startsWith('step-')) && appLayout === 'play') setAppLayout('forge');
  const el = document.getElementById(id);
  el?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
  if (focusField) el?.querySelector('select, input, textarea, button')?.focus({ preventScroll: true });
}

$('#edition').addEventListener('click', e => {
  const b = e.target.closest('[data-ed]'); if (!b || b.dataset.ed === st.edition) return;
  st.edition = b.dataset.ed; st.subclass = ''; render();
});

$('#sheet').addEventListener('click', e => {
  const g = e.target.closest('[data-goto]');
  if (g) { goTo(g.dataset.goto); return; }
  const f = e.target.closest('[data-feat]');
  if (f) { document.querySelectorAll('#sheet .feat').forEach(d => d.open = f.dataset.feat === 'open'); return; }

  // Play Actions
  const actBtn = e.target.closest('[data-act]');
  if (actBtn) {
    const act = actBtn.dataset.act;
    const maxHp = E.compute(st, data()).hp;
    const curHp = Math.min(st.hpCurrent ?? maxHp, maxHp);
    // keep focus on the control that was used: the sheet re-renders under it
    const refocus = sel => { renderSheet(); save(); if (sel) $(sel)?.focus(); };
    const amount = () => { const n = Math.floor(+($('#play-hp-inp')?.value) || 0); return n > 0 ? n : 0; };
    // damage eats temporary HP first (PHB p. 198)
    const damage = n => { const absorb = Math.min(+st.hpTemp || 0, n); st.hpTemp = (+st.hpTemp || 0) - absorb; st.hpCurrent = Math.max(0, curHp - (n - absorb)); };
    const heal = n => { st.hpCurrent = Math.min(maxHp, curHp + n); };
    const sameBtn = () => `[data-act="${act}"]` + (actBtn.dataset.n ? `[data-n="${actBtn.dataset.n}"]` : '') + (actBtn.dataset.c ? `[data-c="${actBtn.dataset.c}"]` : '') + (actBtn.dataset.lv ? `[data-lv="${actBtn.dataset.lv}"]` : '') + (actBtn.dataset.idx ? `[data-idx="${actBtn.dataset.idx}"]` : '') + (actBtn.dataset.name ? `[data-name="${CSS.escape(actBtn.dataset.name)}"]` : '');
    if (act === 'hp-mod') {
      const delta = +actBtn.dataset.n || 0;
      delta < 0 ? damage(-delta) : heal(delta);
      refocus(sameBtn()); announce(`Punti ferita: ${st.hpCurrent} su ${maxHp}`); return;
    }
    if (act === 'hp-apply-dmg' || act === 'hp-apply-heal' || act === 'hp-apply-temp') {
      const n = amount();
      if (!n && act !== 'hp-apply-temp') { $('#play-hp-inp')?.focus(); return; }
      if (act === 'hp-apply-dmg') damage(n); else if (act === 'hp-apply-heal') heal(n);
      else st.hpTemp = n; // temporary HP do not stack: the new value replaces the old one (0 clears them)
      refocus('#play-hp-inp');
      announce(act === 'hp-apply-temp' ? `Punti ferita temporanei: ${st.hpTemp}` : `Punti ferita: ${st.hpCurrent} su ${maxHp}`);
      return;
    }
    if (act === 'toggle-insp') {
      st.inspiration = !st.inspiration;
      refocus(sameBtn()); return;
    }
    if (act === 'toggle-cond') {
      const c = actBtn.dataset.c;
      const cur = (st.conditions || []).map(x => x === 'Prone' ? 'Prono' : x === 'Privo di Sensi' ? 'Privo di sensi' : x);
      st.conditions = cur.includes(c) ? cur.filter(x => x !== c) : [...cur, c];
      refocus(sameBtn()); return;
    }
    // slot tracker: tapping a used square restores it (and the ones after it), tapping a free one uses up to it
    if (act === 'toggle-slot' || act === 'toggle-pact') {
      const idx = +actBtn.dataset.idx || 0;
      if (act === 'toggle-slot') {
        const lv = +actBtn.dataset.lv, spent = st.spentSlots?.[lv] || 0;
        st.spentSlots ||= {};
        st.spentSlots[lv] = idx < spent ? idx : idx + 1;
      } else {
        const spent = st.spentPact || 0;
        st.spentPact = idx < spent ? idx : idx + 1;
      }
      refocus(sameBtn()); return;
    }
    if (act === 'res-use' || act === 'res-rec') {
      const name = actBtn.dataset.name, lim = E.compute(st, data()).limited.find(l => l.name === name);
      const maxUses = +lim?.uses || 1;
      st.spentLimited ||= {};
      const spent = st.spentLimited[name] || 0;
      st.spentLimited[name] = act === 'res-use' ? Math.min(maxUses, spent + 1) : Math.max(0, spent - 1);
      renderSheet(); save();
      // the pressed button may now be disabled: fall back to its sibling
      const other = act === 'res-use' ? 'res-rec' : 'res-use', sel = n => `[data-act="${n}"][data-name="${CSS.escape(name)}"]`;
      ($(sel(act) + ':not(:disabled)') || $(sel(other)))?.focus();
      return;
    }
    if (act === 'short-rest') {
      st.spentPact = 0;
      const sc = E.compute(st, data());
      sc.limited.forEach(l => {
        if (/short|sr|breve/i.test(l.recovery)) delete st.spentLimited[l.name];
      });
      renderSheet(); save();
      const m1 = 'Riposo breve: slot del patto e risorse a riposo breve ripristinati.';
      $('#rest-msg').textContent = m1; announce(m1); $('[data-act="short-rest"]')?.focus();
      return;
    }
    if (act === 'long-rest') {
      st.hpCurrent = maxHp;
      st.hpTemp = 0;
      st.spentSlots = {};
      st.spentPact = 0;
      st.spentLimited = {};
      st.spentHitDice = Math.max(0, (st.spentHitDice || 0) - Math.max(1, Math.floor(st.level / 2)));
      renderSheet(); save();
      const m2 = 'Riposo lungo: PF al massimo, slot, risorse e metà dei dadi vita ripristinati.';
      $('#rest-msg').textContent = m2; announce(m2); $('[data-act="long-rest"]')?.focus();
      return;
    }
    if (act === 'jump-forge') { goTo('builder'); return; }
  }

  const b = e.target.closest('[data-view]'); if (!b) return;
  view = b.dataset.view; renderSheet(); $('#tab-' + view)?.focus();
});

$('#sheet').addEventListener('keydown', e => {
  if (!e.target.matches('[role=tab]') || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  e.preventDefault();
  view = e.key === 'Home' ? 'sheet' : e.key === 'End' ? 'bib' : view === 'sheet' ? 'bib' : 'sheet';
  renderSheet(); $('#tab-' + view)?.focus();
});

const builder = $('#builder');
builder.addEventListener('submit', e => e.preventDefault());
builder.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.filter === 'q') { spellQ = t.value; applySpellFilter(); return; }
  if (t.dataset.inv !== undefined) {
    const row = st.inventory[+t.dataset.inv];
    if (row) { row[t.dataset.f] = t.dataset.f === 'name' ? t.value : +t.value || 0; renderSheet(); save(); }
    return;
  }
  if (t.dataset.xcfilter !== undefined) {
    const q = t.value.trim().toLowerCase();
    t.closest('details').querySelectorAll('[data-xcname]').forEach(r => { r.hidden = !!q && !r.dataset.xcname.includes(q); });
    return;
  }
  if (!t.dataset.k || t.tagName === 'SELECT' || t.type === 'checkbox') return;
  delete st.example;
  setPath(t.dataset.k, 'num' in t.dataset ? (t.value === '' ? 0 : Number(t.value)) : t.value);
  renderSheet(); save();
  const pc = $('#pb-counter');
  if (pc) { const n = E.pointBuyCost(st.base.map(Number)); pc.textContent = isNaN(n) ? 'valori fuori 8–15' : n + ' / 27'; pc.classList.toggle('over', isNaN(n) || n > 27); }
});

builder.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter) {
    if (t.dataset.filter === 'school') spellSchool = t.value;
    if (t.dataset.filter === 'ritual') spellRitual = t.checked;
    if (t.dataset.filter === 'chosen') spellChosen = t.checked;
    if (t.dataset.filter !== 'q') applySpellFilter();
    return;
  }
  if (t.dataset.fc) { st.featureChoices[t.dataset.fc] = t.value; delete st.example; render(); return; }
  if (t.dataset.lv) { st.levels[+t.dataset.lv] = t.value; delete st.example; render(); return; }
  if (t.dataset.sub) { st.subclasses[t.dataset.sub] = t.value; if (t.dataset.sub === st.cls) st.subclass = t.value; render(); return; }
  if (t.dataset.cs) {
    const cur = new Set(st.classSpells[t.dataset.cs] || []);
    t.checked ? cur.add(t.value) : cur.delete(t.value);
    st.classSpells[t.dataset.cs] = [...cur]; delete st.example; render(); return;
  }
  if (t.dataset.miadd !== undefined) {
    const D = data(), q = t.value.trim().toLowerCase();
    const key = Object.keys(D.magicItems || {}).find(k => D.magicItems[k].name.toLowerCase() === q);
    if (key) { st.magicItems.push({ key, attuned: false, choice: '' }); render(); $('#f-mi-add')?.focus(); }
    return;
  }
  if (t.dataset.comp) { st.companions[t.dataset.comp] = t.value; render(); return; }
  if (t.dataset.miat !== undefined) { st.magicItems[+t.dataset.miat].attuned = t.checked; render(); return; }
  if (t.dataset.mich !== undefined) { st.magicItems[+t.dataset.mich].choice = t.value; render(); return; }
  if (t.dataset.gearadd !== undefined) { const g = data().gear?.[t.value]; if (g) { st.inventory.push({ name: g.name, qty: 1, weight: g.weight }); render(); } return; }
  if (t.dataset.packadd !== undefined) { const pk = data().packs?.[t.value]; if (pk) { pk.items.forEach(x => st.inventory.push({ name: x.name, qty: x.amount, weight: x.weight })); render(); } return; }
  if (t.dataset.xc) {
    const k = t.dataset.xc, cur = new Set(st.extraChoices[k] || []);
    t.checked ? cur.add(t.value) : cur.delete(t.value);
    st.extraChoices[k] = [...cur]; delete st.example; render(); return;
  }
  if (t.dataset.bs) {
    const arr = [...(st.bonusSpells[t.dataset.bs] || [])];
    arr[+t.dataset.i] = t.value;
    st.bonusSpells[t.dataset.bs] = arr; delete st.example; render(); return;
  }
  if (t.dataset.pers) {
    const row = data().backgrounds[st.background][t.dataset.pers]?.[t.value];
    if (row !== undefined) { st.personality[t.dataset.pers] = persText(row); delete st.example; render(); }
    return;
  }
  if (t.id === 'f-file') {
    const f = t.files[0]; if (!f) return;
    f.text().then(txt => importJSON(txt));
    return;
  }
  if (t.dataset.act === 'addWeapon') { if (t.value) st.weapons.push(t.value); }
  else if (t.dataset.list) {
    const arr = st[t.dataset.list];
    if (t.checked) { if (!arr.includes(t.value)) arr.push(t.value); } else st[t.dataset.list] = arr.filter(v => v !== t.value);
    if (t.dataset.list === 'skills' && !t.checked) st.expertise = st.expertise.filter(v => v !== t.value);
  }
  else if (t.dataset.k) {
    if (t.tagName !== 'SELECT' && t.type !== 'checkbox') return;
    setPath(t.dataset.k, t.type === 'checkbox' ? t.checked : 'num' in t.dataset ? Number(t.value) : t.value);
    if (t.dataset.k === 'race') st.subrace = '';
    if (t.dataset.k === 'cls') { const old = st.levels[0]; st.levels = st.levels.map((k, i) => i === 0 || k === old ? t.value : k); st.subclasses = {}; }
    if (/\.feat$/.test(t.dataset.k)) setPath(t.dataset.k.replace(/feat$/, 'choice'), '');
    if (t.dataset.k === 'originFeat') st.originFeatChoice = '';
    if (t.dataset.k === 'cls') { st.subclass = ''; st.featureChoices = {}; }
    if (t.dataset.k === 'method') st.base = t.value === 'pointbuy' ? [8, 8, 8, 8, 8, 8] : [15, 14, 13, 12, 10, 8];
  } else return;
  delete st.example; render();
});

builder.addEventListener('click', e => {
  const setLvlBtn = e.target.closest('[data-setlvl]');
  if (setLvlBtn) {
    st.level = +setLvlBtn.dataset.setlvl || 1;
    delete st.example;
    render();
    return;
  }

  const g = e.target.closest('[data-goto]');
  if (g) { goTo(g.dataset.goto, true); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act, msg = t => { const m = $('#io-msg'); if (m) m.textContent = t; };
  if (act !== 'reset') resetArmed = false;

  if (act === 'speedrun-opt') { speedrunOptimizeAbilityScores(); return; }
  if (act === 'speedrun-equip') { speedrunEquipRecommended(); return; }
  if (act === 'jump-play') { setAppLayout('play'); window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); return; }

  if (act === 'rmWeapon') { st.weapons.splice(+b.dataset.i, 1); render(); }
  if (act === 'rmItem') { st.magicItems.splice(+b.dataset.i, 1); render(); }
  if (act === 'addInv') { st.inventory.push({ name: '', qty: 1, weight: 0 }); render(); }
  if (act === 'rmInv') { st.inventory.splice(+b.dataset.i, 1); render(); }
  if (act === 'addBgItems') {
    const bgd = data().backgrounds[st.background];
    (bgd.items || []).forEach(x => st.inventory.push({ name: x.name, qty: x.amount, weight: x.weight }));
    if (bgd.gold) st.coins.gp = (+st.coins.gp || 0) + bgd.gold;
    render();
  }
  if (act === 'addStart') {
    const o = data().classes[st.cls].startOptions[+b.dataset.i], pk = o.pack && data().packs?.[o.pack];
    o.items.forEach(x => st.inventory.push({ name: x.name, qty: x.amount, weight: x.weight }));
    if (pk) pk.items.forEach(x => st.inventory.push({ name: x.name, qty: x.amount, weight: x.weight }));
    if (o.gold) st.coins.gp = (+st.coins.gp || 0) + o.gold;
    render();
  }
  if (act === 'addFeat') { st.extraFeats.push({ feat: '', choice: '' }); render(); $('#f-slot-extra' + (st.extraFeats.length - 1))?.focus(); }
  if (act === 'rmFeat') { st.extraFeats.splice(+b.dataset.i, 1); render(); }
  if (act === 'rollPers') {
    const table = data().backgrounds[st.background][b.dataset.f] || [];
    if (table.length) { st.personality[b.dataset.f] = persText(table[Math.floor(Math.random() * table.length)]); delete st.example; render(); $('#f-p-' + b.dataset.f)?.focus(); }
  }
  if (act === 'roll') {
    const d6 = () => 1 + Math.floor(Math.random() * 6);
    st.base = st.base.map(() => { const r = [d6(), d6(), d6(), d6()].sort((a, b) => a - b); return r[1] + r[2] + r[3]; });
    delete st.example; render();
  }
  if (act === 'copy') {
    const txt = JSON.stringify(st, null, 1);
    $('#f-json').value = txt;
    navigator.clipboard?.writeText(txt).then(() => msg('JSON copiato negli appunti.'), () => { $('#f-json').select(); msg('Copia non disponibile: usa Ctrl+C.'); })
      ?? ($('#f-json').select(), msg('Usa Ctrl+C per copiare.'));
  }
  if (act === 'import') importJSON($('#f-json').value);
  if (act === 'reset') {
    if (!resetArmed) { resetArmed = true; renderBuilder(); return; }
    resetArmed = false; st = blank(st.edition); render();
  }
});

function importJSON(txt) {
  try {
    const c = JSON.parse(txt);
    if (!ALL[c.edition]) throw new Error('manca "edition" (2014 o 2024)');
    st = Object.assign(blank(c.edition), c); render();
    $('#io-msg').textContent = `Importato: ${st.name || 'personaggio senza nome'}.`;
  } catch (err) { $('#io-msg').textContent = 'JSON non valido: ' + err.message + '.'; }
}

render();
try { const m = localStorage.getItem('mpmb-layout'); if (m === 'forge' || m === 'split') setAppLayout(m); } catch { }
</script>
</body>
